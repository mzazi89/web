name: Android app

# Two ways to build:
#   • Actions → "Android app (debug APK)" → Run workflow  (the normal path)
#   • automatically, when anything under android/ changes
#
# Either way the installable file lands in the run's Artifacts section as a zip.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Address the app opens (https only — defaults to the live site)'
        required: false
        default: 'https://www.mzazi.shop'
      version_name:
        description: 'Version label shown in Settings → Apps'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Android SDK platform 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "Installing platform 34 + build-tools 34.0.0"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "android-34 already present"
          fi

      - name: Validate the configured address
        env:
          SITE_URL: ${{ inputs.site_url || 'https://www.mzazi.shop' }}
        run: |
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::site_url must start with https:// (cleartext is disabled in the app)"; exit 1 ;;
          esac
          echo "Building for $SITE_URL"

      - name: Build debug APK
        env:
          SITE_URL: ${{ inputs.site_url || 'https://www.mzazi.shop' }}
          VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PappUrl="$SITE_URL" \
            -PversionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Collect APK
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/mzazi-tech-debug.apk
          ls -lh ../artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mzazi-tech-debug-apk
          path: artifacts/mzazi-tech-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: always()
        env:
          SITE_URL: ${{ inputs.site_url || 'https://www.mzazi.shop' }}
        run: |
          {
            echo "### Android debug build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Address | \`$SITE_URL\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Status | ${{ job.status }} |"
            echo ""
            echo "**Download:** scroll to *Artifacts* at the bottom of this page →"
            echo "**mzazi-tech-debug-apk**."
            echo ""
            echo "> The artifact is a **zip**. Unzip it and install \`mzazi-tech-debug.apk\`."
            echo "> Android will warn that the app is unsigned-for-Play / from an unknown source —"
            echo "> that is expected for a debug build."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-latest:
    name: Publish APK to Releases
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: mzazi-tech-debug-apk
          path: artifacts

      - name: Announce the version on the site
        env:
          VERSION_NAME: ${{ format('1.0.{0}', github.run_number) }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "public/app-version.json";
            const doc = JSON.parse(fs.readFileSync(path, "utf8"));
            doc.version = process.env.VERSION_NAME;
            doc.versionCode = Number(process.env.VERSION_CODE);
            doc.url = "https://www.mzazi.shop/mzazitech.apk";
            doc.notes = "Bug fixes and performance improvements.";
            doc.publishedAt = new Date().toISOString();
            fs.writeFileSync(path, JSON.stringify(doc, null, 2) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          git diff --staged --quiet || git commit -m "android: publish v${VERSION_NAME}"
          git push

      # Replace the asset outright. The action-based upload reported success
      # while leaving the previous APK in place, which is worse than failing:
      # the site announced v1.0.4 and the release still served v1.0.2.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" \
              --title "MZAZI TECH — Android (latest)" \
              --prerelease \
              --notes "Current build of the MZAZI TECH app — a WebView shell around https://www.mzazi.shop. Tap the APK to install, and allow install unknown apps when Android asks."
          gh release upload android-latest artifacts/mzazi-tech-debug.apk \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Confirm the published asset matches this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL=$(stat -c %s artifacts/mzazi-tech-debug.apk)
          for attempt in 1 2 3 4; do
            REMOTE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-latest" \
              --jq '.assets[] | select(.name=="mzazi-tech-debug.apk") | .size')
            echo "attempt $attempt: local=$LOCAL published=$REMOTE"
            if [ "$REMOTE" = "$LOCAL" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::The published APK does not match this build"
          exit 1

  release:
    name: Attach APK to release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: mzazi-tech-debug-apk
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mzazi-tech-debug.apk
          name: MZAZI TECH ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Debug build of the MZAZI TECH app (WebView shell around mzazi.shop).

            Download `mzazi-tech-debug.apk` from Assets — a release asset is a
            direct download, unlike the Actions artifact which is a zip.
